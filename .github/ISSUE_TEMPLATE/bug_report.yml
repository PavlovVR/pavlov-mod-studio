name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. **Never paste your mod.io token** here, in a log or in a screenshot.

        Security problems go through [SECURITY.md](https://github.com/PavlovVR/pavlov-mod-studio/blob/main/SECURITY.md) instead.
  - type: input
    id: version
    attributes:
      label: App version
      description: It's in Settings, under Updates.
      placeholder: "0.4.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Publishing or uploading
        - Cooking or a build failure
        - Choosing assets (Cook tab)
        - Managing a mod (Files, Page, Media, Comments and so on)
        - Creating a mod
        - Source plugins
        - Connecting to mod.io
        - Updates
        - Installing the app
        - Command line
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include any error message, word for word.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      placeholder: |
        1. Open the Publish tab
        2. Choose Both
        3. Select Publish
    validations:
      required: true
  - type: dropdown
    id: unreal
    attributes:
      label: Was Unreal open?
      options:
        - "Yes"
        - "No"
        - Not sure
  - type: textarea
    id: log
    attributes:
      label: Log
      description: In the run panel, turn on Verbose and select Copy, then paste it here. Longer logs are in `Saved\Logs` in your modkit.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send this
      options:
        - label: I searched the existing issues.
          required: true
        - label: This doesn't contain my mod.io token.
          required: true
