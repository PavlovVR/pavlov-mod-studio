name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change list
        run: python scripts/release_notes.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Add rc.exe to PATH
        shell: pwsh
        run: |
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" | Sort-Object FullName | Select-Object -Last 1
          Add-Content $env:GITHUB_PATH $rc.DirectoryName
      - name: Build the interface
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npx vite build
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test
      - name: Upload flow against a fake mod.io
        run: |
          cargo build --release -p pavlov-mod-studio
          python tests/upload_flow.py
          python tests/manage_flow.py
