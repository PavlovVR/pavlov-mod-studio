name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match app version $version"
          }
      - name: Check the update signing key is set
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Add the TAURI_SIGNING_PRIVATE_KEY secret. Installed apps only accept updates signed with it."
          }
      - name: Read the change list
        run: python scripts/release_notes.py release-notes.md
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Add rc.exe to PATH
        shell: pwsh
        run: |
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\rc.exe" | Sort-Object FullName | Select-Object -Last 1
          Add-Content $env:GITHUB_PATH $rc.DirectoryName
      - name: Install the interface's packages
        working-directory: app
        run: npm ci
      - name: Build the installer
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --config src-tauri/tauri.release.conf.json
      # CI tests this same commit while the installer builds, so nothing is tested twice and
      # nothing is published until those tests pass.
      - name: Wait for CI to pass on this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ($i = 0; $i -lt 60; $i++) {
            $run = @(gh run list --workflow ci.yml --commit $env:GITHUB_SHA --limit 1 --json status,conclusion --jq '.[0].status, .[0].conclusion')
            if ($run[0] -eq 'completed') {
              if ($run[1] -eq 'success') { exit 0 }
              throw "CI failed on this commit, so nothing was released."
            }
            Start-Sleep -Seconds 15
          }
          throw "CI didn't finish on this commit, so nothing was released. Push the commit to main before tagging it."
      - name: Write the update manifest
        run: python scripts/update_manifest.py release
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem release/*-setup.exe).FullName
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "Pavlov Mod Studio $tag" --notes-file release-notes.md
            gh release upload $tag $installer release/latest.json --clobber
          } else {
            gh release create $tag $installer release/latest.json --title "Pavlov Mod Studio $tag" --notes-file release-notes.md
          }
